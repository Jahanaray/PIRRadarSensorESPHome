############################################################
# ESP-01 OUTDOOR SECURITY NODE - PIN MAPPING
############################################################
# ESP-01 PINS:
#
# GPIO0  -> NOT USED (boot critical, must stay HIGH at boot)
# GPIO2  -> HC-SR501 PIR OUTPUT
# GPIO3  -> RCWL0516 RADAR OUTPUT (RX used as GPIO input)
#
# POWER:
# ESP-01  -> 3.3V ONLY
# PIR     -> 5V
# RCWL0516-> 5V (output usually 3.3V logic compatible, verify!)
#
# GND ALL MUST BE COMMON
############################################################

esphome:
  name: outdoor_security_node_01
  friendly_name: Outdoor Security Node (Module 01)
  on_boot:
    priority: -10
    then:
      - logger.log: "Outdoor Security Node booted"

esp8266:
  board: esp01_1m

############################################################
# STABILITY
############################################################

logger:
  baud_rate: 0

############################################################
# WIFI
############################################################

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  power_save_mode: none
  fast_connect: true

  ap:
    ssid: !secret fallback_wifi_ssid
    password: !secret fallback_wifi_password

captive_portal:

############################################################
# HOME ASSISTANT API
############################################################

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

############################################################
# OTA UPDATE
############################################################

ota:
  platform: esphome
  username: !secret ota_username
  password: !secret ota_password

############################################################
# DAY/NIGHT STATUS FROM HOME ASSISTANT
############################################################

binary_sensor:
  - platform: homeassistant
    id: is_night
    entity_id: sun.sun
    internal: true

  # PIR SENSOR (HC-SR501)
  - platform: gpio
    id: pir_motion
    name: "PIR Motion"
    device_class: motion
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: !lambda |-
          return id(is_night).state ? 800 : 1000;
      - delayed_off: 1s

  # RADAR SENSOR (RCWL0516)
  - platform: gpio
    id: radar_motion
    name: "Radar Motion"
    device_class: motion
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: false
    filters:
      - delayed_on: 2800ms
      - delayed_off: 1s

  ##########################################################
  # COMBINED HIGH-CONFIDENCE INTRUSION
  ##########################################################
  - platform: template
    id: confirmed_intrusion
    name: "Confirmed Intrusion"
    device_class: motion
    lambda: |-
      return (id(pir_motion).state && id(radar_motion).state);
    filters:
      - delayed_on: 200ms
      - delayed_off: 10s

############################################################
# DEVICE CONTROL
############################################################

switch:
  - platform: restart
    name: "Restart Device"